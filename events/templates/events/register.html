<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - University Society Event & Ticketing Manager</title>
    <style>

        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .auth-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        .role-indicator { font-weight: bold; color: #555; margin-bottom: 20px; text-transform: uppercase; font-size: 12px; }
        .error-msg { color: #d9534f; background-color: #fdf7f7; padding: 10px; border: 1px solid #d9534f; border-radius: 4px; margin-bottom: 15px; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background-color: #218838; }
        .switch-link { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="role-indicator">
            {% if current_role == 'student' %}
                Student Register
            {% else %}
                Admin Register
            {% endif %}
        </div>

        <h2>Register</h2>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'register' %}?role={{ current_role }}">
            {% csrf_token %}
            <div class="form-group">
                <label> Name: </label>
                <input type="text" name="name" value="{{ request.POST.name }}" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" value="{{ request.POST.email }}" required>
            </div>
            <div class="form-group">
                <label>new password:</label>
                <input type="password" name="password" minlength="8" required>
            </div>
            <div class="form-group">
                <label>make sure password:</label>
                <input type="password" name="confirm_password" minlength="8" required>
            </div>
            <button type="submit" class="btn">register</button>
        </form>

        <div class="switch-link">
            already have account? <a href="{% url 'login' %}?role={{ current_role }}">login now</a>
        </div>
    </div>
</body>
</html>
